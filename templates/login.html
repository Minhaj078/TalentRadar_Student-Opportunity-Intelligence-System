{% extends 'base.html' %}
{% block content %}

<div class="container">
    <div class="card">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p style="text-align:center; margin-top:15px;">
            Don't have an account? <a href="/register/">Register</a>
        </p>
    </div>
</div>

{% endblock %}
